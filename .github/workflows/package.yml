name: Build Packages (Debian & Fedora)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Debian / Ubuntu (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb package
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-rpm:
    name: Build Fedora (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          dnf -y install rpm-build rpmdevtools python3-devel python3-setuptools python3-pip tar

      - name: Build RPM package
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          tar --exclude='./.git' --exclude='./.venv' --exclude='./build_deb' --exclude='./dist' \
              -czf ~/rpmbuild/SOURCES/drivemounter-1.0.0.tar.gz --transform 's,^\.,drivemounter-1.0.0,' .
          rpmbuild -ba packaging/drivemounter.spec
          mkdir -p dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: dist/*.rpm

  release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/debian-package/*.deb
            dist-release/fedora-package/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
